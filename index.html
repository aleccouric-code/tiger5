<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandie</title>
<meta name="description" content="Golf scores, handicaps, Tiger 5 tracking, trips and side bets for you and your friends.">
<meta name="theme-color" content="#0F2A1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sandie">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Serif+Display:ital@0;1&family=Manrope:wght@500;700&display=swap">
<style>
/* Splash screen ("Sandie — loading" design): shown for 3 s once per launch. */
#splash{position:fixed;inset:0;z-index:100;background:#0F2A1D;color:#F3EAD3;font-family:Manrope,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(120px + env(safe-area-inset-top)) 32px calc(64px + env(safe-area-inset-bottom));overflow:hidden;transition:opacity .45s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash .s-hill{position:absolute;left:-120px;right:-120px;bottom:-260px;height:520px;border-radius:50%;background:#16392A}
#splash .s-hill.two{left:-60px;right:-60px;bottom:-340px;background:#1C4533}
#splash .s-top,#splash .s-bottom{display:flex;flex-direction:column;align-items:center;position:relative}
#splash .s-top{gap:36px}
#splash .s-bottom{gap:18px}
#splash .s-emblem{width:168px;height:168px;border-radius:50%;border:2px solid #E3B04B;display:flex;align-items:center;justify-content:center}
#splash h1{margin:0;font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:72px;line-height:1;letter-spacing:-1px;color:#F3EAD3}
#splash h1 em{font-style:normal;color:#E3B04B}
#splash .s-tag{margin:14px 0 0;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#CFC4A8;text-align:center}
#splash .s-ld{display:flex;gap:10px;align-items:center}
#splash .s-ld span{width:10px;height:10px;border-radius:50%;background:#F3EAD3;display:block;animation:sdot 1.2s ease-in-out infinite}
#splash .s-ld span:nth-child(2){animation-delay:.15s}
#splash .s-ld span:nth-child(3){animation-delay:.3s;background:#E3B04B}
#splash .s-msg{margin:0;font-size:15px;color:#E6DCC2}
@keyframes sdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-6px)}}
@media (max-height:640px){#splash{padding-top:calc(60px + env(safe-area-inset-top))}#splash h1{font-size:52px}#splash .s-emblem{width:140px;height:140px}}
@media (prefers-reduced-motion:reduce){#splash .s-ld span{animation:none;opacity:.8}#splash{transition:none}}
/* Layout: single phone-width column, sticky header, fixed bottom tab bar */
:root{
 --bg:#eef3ec;--card:#fff;--ink:#16261d;--mute:#5d7064;--line:#cfdacb;--green:#2e6b45;--on-green:#f4faf5;
 --red:#c9342a;--redbg:#fbe4e1;--gbg:#dcebdf;--gold:#9a6b12;--goldbg:#f6ecd3;
 --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#13201a;--card:#1b2c23;--ink:#e6efe8;--mute:#93a99b;--line:#2f4538;--green:#6fc28b;--on-green:#0f1a14;--red:#ff7a6e;--redbg:#3c2420;--gbg:#23402d;--gold:#e2b75a;--goldbg:#3a3020;color-scheme:dark}}
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left));padding-block:0 calc(110px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:calc(14px + env(safe-area-inset-top)) 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.eyebrow{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:600}
h1{font-size:24px;font-weight:800;margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:17px;margin:22px 0 8px;font-weight:800}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:15px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;min-height:44px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.primary{background:var(--green);color:var(--on-green);border-color:var(--green);font-weight:600}
.wide{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.seg{display:flex;gap:6px}
.seg button{flex:1}
.seg button[aria-pressed=true]{background:var(--green);color:var(--on-green);border-color:var(--green)}
/* Brand bar: same deep green and gold as the splash screen, in both light and dark mode */
.brandbar{position:sticky;top:0;z-index:5;margin:0 -16px 0;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#0F2A1D;color:#F3EAD3;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;min-height:0;color:inherit;min-width:0}
.logo{width:46px;height:46px;flex:none}
.wm{font-family:"DM Serif Display",Georgia,serif;font-size:32px;line-height:1;letter-spacing:-.5px;color:#F3EAD3;white-space:nowrap}
.wm em{font-style:normal;color:#E3B04B}
.brandbar .idx{border-color:#E3B04B;background:transparent;width:56px;height:56px}
.brandbar .idx b{color:#F3EAD3;font-size:18px}
.brandbar .idx span{color:#CFC4A8}
.ptitle{padding-block:14px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ptitle h1{font-size:26px}
.gear{flex:none;width:42px;height:42px;min-height:0;padding:0;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.gear svg{width:22px;height:22px}
.pname{display:block;font-size:20px;font-weight:800;line-height:1.2}
/* Settings: grouped rows like a phone settings app */
.setgroup{margin:0 0 18px}
.sethead{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 4px 6px}
.setgroup>.setprof,.setgroup>.setrow{background:var(--card);border:1px solid var(--line);border-top-width:0;padding:12px 14px}
.setgroup>:nth-child(2){border-top-width:1px;border-radius:14px 14px 0 0}
.setgroup>:last-child{border-radius:0 0 14px 14px}
.setgroup>:nth-child(2):last-child{border-radius:14px}
.setprof{display:flex;align-items:center;gap:14px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;width:100%;text-align:left;font:inherit;color:var(--ink);text-decoration:none}
.setrow.col{flex-direction:column;align-items:stretch;gap:6px}
.setlab{font-weight:600}
.setval{color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.setbtn{display:inline-flex;align-items:center;min-height:38px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;margin:0}
.setbtn.red{background:var(--red);border-color:var(--red);color:#fff}
.red-t{color:var(--red)}
.setlink{cursor:pointer}
.setat{flex:none;font-weight:700;color:var(--mute)}
button.setrow{border-radius:0}
.idx{flex:none;width:62px;height:62px;border-radius:50%;border:2px solid var(--green);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;min-height:0}
.idx b{font-size:20px;font-weight:800;line-height:1}
.idx span{font-size:9px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tabs button{border:0;border-radius:0;background:none;color:var(--mute);font-weight:600;font-size:11px;padding:8px 0 7px;white-space:nowrap;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;min-width:0}
.tabs .ti svg{width:23px;height:23px;display:block}
.tabs .tl{line-height:1;letter-spacing:.01em}
.tabs .badge{position:absolute;top:3px;left:calc(50% + 6px);margin:0;font-size:10px;line-height:16px;min-width:16px}
.lbcats{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 4px;scrollbar-width:none}
.lbcats::-webkit-scrollbar{display:none}
.lbcats button{flex:none;min-height:38px;padding:6px 13px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap}
.lbcats button[aria-selected=true]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.lbtable td{padding:9px 0}
.lbtable .lbrank{width:34px;font-weight:800;color:var(--mute);font-size:16px}
.lbtable tr.mine td{background:var(--gbg)}
.lbtable tr.mine td:first-child{border-radius:8px 0 0 8px;padding-left:6px}
.lbtable tr.mine td:last-child{border-radius:0 8px 8px 0;padding-right:6px}
.tabs button[aria-current=page]{color:var(--green);box-shadow:inset 0 3px 0 var(--green)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:var(--card);font-size:12px;line-height:18px;margin-left:4px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mid span{color:var(--mute);font-size:14px}
.plain{border:0;padding:0;background:none;min-height:0}
.score{text-align:right;flex:none}
.score b{display:block;font-size:26px;font-weight:800;line-height:1}
.score span{font-size:13px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:13px;padding:2px 8px;border-radius:99px;background:var(--gbg);color:var(--green);font-weight:600}
.tag.red{background:var(--redbg);color:var(--red)}
.tag.gold{background:var(--goldbg);color:var(--gold)}
.tag.poo,.tag.trophy{background:var(--goldbg);font-size:15px;line-height:1.25;padding:1px 7px}
.tag.trophy{background:var(--gbg)}
.hole-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hole-head b{font-size:40px;font-weight:800;line-height:1}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:52px;flex:none;font-size:24px}
.stepper output{flex:1;text-align:center;font-size:44px;font-weight:800}
.stepper.sm{gap:6px}
.stepper.sm button{width:44px;font-size:20px}
.stepper.sm output{font-size:28px}
.pcard{border-left:4px solid var(--gold)}
.pcard .phd{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.pcard .phd b{font-size:17px}
.pcard label{margin-top:4px}
.pcard .pick button{min-height:36px;font-size:14px}
.mini{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px;margin-right:8px}
.mini button{min-height:32px;width:32px;padding:0;border-radius:50%;border:0;font-size:18px}
.mini span{font-weight:700;min-width:34px;text-align:center}
.sidetrack{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.sthead{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.sidetrack label{margin-top:6px}
.shotgun{margin-top:8px;padding:6px 8px 8px;border-radius:10px;background:var(--goldbg)}
.shotgun label{margin:0 0 4px;font-size:13px}
.stepper.xs{gap:4px}
.stepper.xs button{width:34px;min-height:34px;padding:0;font-size:17px}
.stepper.xs output{font-size:20px}
.scrow .filebtn{display:block;text-align:center;margin:0;background:var(--card);color:var(--ink);border:1px dashed var(--line)}
.scrow .filebtn.done{background:var(--gbg);color:var(--green);border-style:solid;border-color:var(--green)}
.coursebtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;background:var(--bg)}
.coursebtn .cbtxt{flex:1;min-width:0}
.coursebtn .cbtxt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coursebtn .cbtxt span{font-size:13px;color:var(--mute)}
.coursebtn .chg{flex:none;font-size:14px;font-weight:700;color:var(--green)}
.cpick{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:grid;gap:8px}
.cpick .seg.sm button{min-height:34px;font-size:13px;padding:4px 8px}
.clist{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:0 -4px;padding:2px 4px;-webkit-overflow-scrolling:touch}
.clist>*{flex:none}
.clist button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;padding:11px 14px;min-height:56px;border-radius:10px;background:var(--card);line-height:1.25}
.clist button b{display:block;font-size:16px;line-height:1.25;white-space:normal}
.clist button span{display:block;font-size:13px;line-height:1.3;color:var(--mute)}
.clist button.on{border-color:var(--green);background:var(--gbg)}
.stepper.need{outline:2px solid var(--red);outline-offset:4px;border-radius:12px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px}
.toggle[aria-pressed=true]{background:var(--gbg);border-color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;margin-top:10px}
.chip{background:var(--redbg);color:var(--red);border-radius:99px;padding:3px 10px;font-weight:600;font-size:14px}
.chip.ok{background:var(--gbg);color:var(--green)}
.strip{display:grid;gap:4px;margin:0 0 10px}
.strip button{padding:6px 0;min-height:40px;font-size:14px;border-radius:8px}
.strip .cur{outline:2px solid var(--ink)}
.strip .bad{background:var(--redbg);border-color:var(--red);color:var(--red)}
.strip .done{background:var(--gbg)}
.big{display:flex;gap:6px}
.big div{flex:1;text-align:center;min-width:0}
.big b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.big span{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-weight:800}
.bar{height:8px;border-radius:4px;background:var(--gbg);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.scroll{overflow-x:auto}
.sc{border-collapse:collapse;font-size:14px;min-width:100%}
.sc th,.sc td{border:1px solid var(--line);padding:6px 4px;text-align:center;min-width:30px}
.sc th:first-child,.sc td:first-child{text-align:left;padding-left:8px;min-width:58px;color:var(--mute);font-weight:600}
.sc .miss{background:var(--redbg);color:var(--red);font-weight:800}
.sc .u{background:var(--gbg);color:var(--green);font-weight:800}
.link{border:0;background:none;color:var(--mute);text-decoration:underline;min-height:0;padding:4px}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0}
.note{background:var(--goldbg);color:var(--ink);border-color:var(--gold)}
.code{font-size:30px;font-weight:800;letter-spacing:.18em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;font-weight:600;max-width:calc(100% - 32px)}
.chart{display:block;width:100%;height:auto}
.empty{text-align:center;padding:26px 14px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.danger{background:var(--red);border-color:var(--red);color:#fff}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{min-height:38px;padding:6px 12px;border-radius:99px}
.pick button[aria-pressed=true]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.bet-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bet-head b{font-size:17px}
.money{font-weight:800;white-space:nowrap}
.lead td{font-weight:800}
.lead td:first-child::after{content:" ★";color:var(--gold)}
.pos{color:var(--green)}.neg{color:var(--red)}
.opt{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.opt .mid{flex:1;min-width:0}
.opt .mid b{display:block}
.opt .mid span{color:var(--mute);font-size:14px}
.opt button{flex:none;min-height:38px;padding:6px 14px}
.opt button[aria-pressed=true]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.opt.won{background:var(--gbg);margin:0 -14px;padding:8px 14px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,18,14,.92);display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom))}
.overlay img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:8px}
.photobtn{border-radius:50%;padding:0;min-height:0;cursor:zoom-in;flex:none}
.photo-ov img{border-radius:12px}
input[type=file]{padding:8px;background:var(--card)}
/* Feed card */
.fcard{padding:0;overflow:hidden}
.fmain{display:block;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:0 14px 12px;min-height:0}
.fhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:14px 14px 0;min-height:0}
.fhead .av{width:44px;height:44px;font-size:16px}
.fhead .mid b{font-size:18px;font-weight:800}
.fidx{color:var(--green);font-weight:600;font-size:15px;margin-left:2px}
.fwhen{margin-left:auto;color:var(--mute);font-size:13px;white-space:nowrap}
.fcourse{display:flex;align-items:center;gap:6px;margin-top:12px;font-weight:600;font-size:17px;line-height:1.25}
.fcourse span{min-width:0}
.flag{width:20px;height:20px;flex:none;color:var(--green)}
.ftee{color:var(--mute);font-size:14px;margin:2px 0 0 26px;min-height:4px}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 10px;border-top:1px solid var(--line);padding-top:12px}
.ring{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.ring .rl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.ring b{width:60px;height:60px;border-radius:50%;border:3px solid var(--ring,var(--line));display:grid;place-items:center;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.ring small{font-size:12px;color:var(--mute);white-space:nowrap}
.factions{display:flex;border-top:1px solid var(--line)}
.factions button{flex:1;border:0;border-radius:0;background:none;color:var(--mute);font-weight:600;font-size:14px;padding:10px 4px;min-height:44px}
.factions button+button{border-left:1px solid var(--line)}
.factions button[aria-pressed=true]{color:var(--green)}
.card>.factions:only-child,.factions[style]{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
img.av{object-fit:cover;background:var(--line)}
.av.xs{width:22px;height:22px;font-size:10px;display:inline-grid;vertical-align:middle;flex:none}
.av.lg{width:84px;height:84px;font-size:30px;border:3px solid var(--green)}
.npic{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;max-width:100%}
.npic>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.opt .mid span .npic{margin-right:8px}
.phead{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.filebtn{display:inline-block;margin:0 8px 0 0;padding:9px 14px;border-radius:10px;background:var(--green);color:var(--on-green);font-weight:600;cursor:pointer}
.namelink{font-weight:800;color:var(--ink);text-decoration:none;padding:0;min-height:0}
a.venmo{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:99px;background:#008CFF;color:#fff;font-size:12px;font-weight:700;text-decoration:none;vertical-align:middle}
.rating{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.rating .rl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.rating b{font-size:28px;font-weight:800;line-height:1.2}
.geeb{color:var(--gold);white-space:nowrap}
.rsum{margin:4px 0 10px;color:var(--mute);font-size:15px}
.rsum b{font-size:15px;color:var(--ink)}
.rscale{display:grid;gap:4px;width:100%;max-width:320px}
.rscale div{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border-radius:9px;font-size:14px;color:var(--mute)}
.rscale div.on{background:var(--gbg);color:var(--ink);font-weight:700}
.fcomments{border-top:1px solid var(--line);padding:8px 14px 10px}
.fcomments p{margin:0 0 6px;font-size:15px;overflow-wrap:anywhere}
.fcomments p b{font-weight:800;margin-right:4px}
.fcomments .link{display:block;margin:0 0 6px;padding:0}
.fcomments input{min-height:38px;padding:7px 10px}
.fcomments button[data-act]{min-height:38px;padding:6px 12px}
.comment{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.comment .av{width:32px;height:32px;font-size:13px}
.comment p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:360px){.ring b{width:52px;height:52px;font-size:18px}}
.ttabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 14px}
.ttabs button{min-height:44px;padding:6px 4px;border-radius:10px;font-weight:600;font-size:15px;white-space:nowrap}
.ttabs button[aria-selected=true]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.ttabs .cnt{display:inline-block;margin-left:5px;font-size:12px;font-weight:800;opacity:.75}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="Sandie is loading">
 <div class="s-hill" aria-hidden="true"></div><div class="s-hill two" aria-hidden="true"></div>
 <div class="s-top">
  <div class="s-emblem">
   <svg width="104" height="120" viewBox="0 0 104 120" fill="none" aria-hidden="true">
    <line x1="34" y1="10" x2="34" y2="104" stroke="#F3EAD3" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M36 12 L92 28 L36 46 Z" fill="#E3B04B"/>
    <path d="M8 104 C 14 92, 40 90, 60 94 C 76 97, 94 94, 98 102 C 102 112, 80 116, 54 116 C 28 116, 4 114, 8 104 Z" fill="#E2CF9F"/>
    <circle cx="66" cy="98" r="9" fill="#F3EAD3"/>
    <circle cx="63" cy="95" r="1.2" fill="#C9BFA6"/><circle cx="68" cy="96" r="1.2" fill="#C9BFA6"/>
    <circle cx="65" cy="100" r="1.2" fill="#C9BFA6"/><circle cx="70" cy="101" r="1.2" fill="#C9BFA6"/>
   </svg>
  </div>
  <div><h1>Sandie<em>.</em></h1><p class="s-tag">Trips · Scores · The Tab</p></div>
 </div>
 <div class="s-bottom">
  <div class="s-ld" aria-hidden="true"><span></span><span></span><span></span></div>
  <p class="s-msg">Pouring the first round…</p>
 </div>
</div>
<script>
// Splash: on every open and refresh, except mid-round (a round in progress
// is saved on the phone) or when the app reloads itself to install an update. Tap to skip.
(function(){
 var s=document.getElementById('splash'),skip=false;
 try{
  var d=JSON.parse(localStorage.getItem('tiger5-draft-v2')||'null');
  skip=!!(d&&d.holes)||sessionStorage.getItem('t19-skip-splash')==='1';
  sessionStorage.removeItem('t19-skip-splash');
 }catch(e){}
 if(skip){s.remove();return}
 var hide=function(){if(!s.isConnected)return;s.classList.add('out');setTimeout(function(){s.remove()},500)};
 // 3 seconds when the app opens, 1.5 seconds on a refresh.
 var isReload=false;
 try{var nav=performance.getEntriesByType('navigation')[0];isReload=nav?nav.type==='reload':performance.navigation&&performance.navigation.type===1}catch(e){}
 s.addEventListener('click',hide);setTimeout(hide,isReload?1500:3000);
})();
</script>
<main id="app"></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js"></script>
