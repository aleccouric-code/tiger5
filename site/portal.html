<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Stats — Sandie</title>
<meta name="description" content="Sign in to see your Sandie stats: handicap trend, scoring breakdown, Tiger 5, putting, courses and more.">
<meta name="theme-color" content="#0F2A1D">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Stats portal: brand bar on top, cream paper, white cards. Charts use one hue (fairway green)
   on the card surface; reference lines in gold; grid and axes recessive. */
:root{
 --green:#0F2A1D;--green-2:#16392A;--fairway:#2E6B45;--fairway-l:#9CC3A8;
 --gold:#E3B04B;--gold-d:#9A6B12;--cream:#F3EAD3;--paper:#FBF7EE;--card:#fff;
 --ink:#14231A;--mute:#5B6B60;--faint:#8A978E;--line:#E4DAC2;--grid:#EEE7D6;--red:#C9342A;
 --serif:"DM Serif Display",Georgia,serif;--sans:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
 color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
a{color:inherit}
button,input,select{font:inherit}
.wrap{max-width:1160px;margin:0 auto;padding-inline:max(18px,env(safe-area-inset-left))}
h1,h2{font-family:var(--serif);font-weight:400;margin:0;line-height:1.1;letter-spacing:-.01em}
.bar{background:var(--green);color:var(--cream);padding-top:env(safe-area-inset-top)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--cream)}
.brand svg{width:34px;height:34px}
.brand b{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1}
.brand b i{font-style:normal;color:var(--gold)}
.brand span{font-size:13px;font-weight:700;color:#CFC4A8;margin-left:4px;padding-left:10px;border-left:1px solid rgba(243,234,211,.25)}
.bar nav{display:flex;align-items:center;gap:16px;font-weight:700;font-size:14px}
.bar nav a{color:#E6DCC2;text-decoration:none}
.bar nav button{background:none;border:1px solid rgba(243,234,211,.35);color:var(--cream);border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:13px 22px;font-weight:800;cursor:pointer;background:var(--gold);color:var(--green);text-decoration:none}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* sign in */
.signin{min-height:calc(100vh - 66px);display:grid;place-items:center;padding:40px 0;background:radial-gradient(1200px 500px at 50% 120%,#16392A 0,#0F2A1D 60%) }
.signin .card{width:min(420px,calc(100% - 36px));background:var(--card);border-radius:22px;padding:30px 28px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.signin h1{font-size:36px}
.signin p{color:var(--mute);margin:8px 0 18px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input[type=email],input[type=password]{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:16px}
.err{color:var(--red);font-weight:700;font-size:14px;margin:10px 0 0}
.signin .btn{width:100%;margin-top:18px}
.signin small{display:block;color:var(--mute);margin-top:14px;font-size:13px}

/* dashboard */
.dash{padding:26px 0 70px}
.who{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.av{width:64px;height:64px;border-radius:50%;flex:none;object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;border:3px solid var(--gold)}
.who h1{font-size:34px}
.who p{margin:2px 0 0;color:var(--mute);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 18px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:none;border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--green);color:var(--cream)}
.filters .count{color:var(--mute);font-weight:600;font-size:14px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;min-width:0}
.kpi .l{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.kpi .v{font-family:var(--serif);font-size:38px;line-height:1.05;margin-top:6px}
.kpi .s{font-size:13px;color:var(--mute);font-weight:600;margin-top:2px}
.kpi .up{color:var(--red)}.kpi .down{color:var(--fairway)}
.kpi.hero{background:var(--green);color:var(--cream);border-color:var(--green)}
.kpi.hero .l,.kpi.hero .s{color:#CFC4A8}
.kpi.hero .v{color:var(--gold);font-size:46px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;min-width:0;grid-column:span 6;position:relative}
.panel.w12{grid-column:span 12}.panel.w8{grid-column:span 8}.panel.w4{grid-column:span 4}
@media (max-width:900px){.panel,.panel.w8,.panel.w4{grid-column:span 12}}
.panel h2{font-family:var(--sans);font-weight:800;font-size:17px;letter-spacing:0}
.panel .sub{color:var(--mute);font-size:13px;margin:2px 0 10px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:600 11px var(--sans);fill:var(--faint)}
.chart .lab{fill:var(--ink);font-weight:800;font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);font-weight:600;margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.dot{width:9px;height:9px;border-radius:50%}
.empty{color:var(--mute);padding:26px 0;text-align:center}
details.tbl{margin-top:8px;font-size:13px}
details.tbl summary{cursor:pointer;color:var(--fairway);font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--grid);font-size:14px}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.hbar{display:grid;gap:9px;margin-top:6px}
.hbar .row{display:grid;grid-template-columns:minmax(110px,40%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.hbar .row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hbar .track{display:block;height:12px;background:var(--grid);border-radius:4px;overflow:hidden}
.hbar .fill{display:block;height:100%;background:var(--fairway);border-radius:0 4px 4px 0}
.hbar .row.me .t{font-weight:800}
.hbar .row.me .fill{background:var(--gold-d)}
.hbar .val{font-weight:800;min-width:42px;text-align:right}
.extras{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.extras div{background:var(--paper);border-radius:12px;padding:12px;text-align:center}
.extras b{display:block;font-family:var(--serif);font-size:30px;font-weight:400;line-height:1.1}
.extras span{font-size:12px;color:var(--mute);font-weight:700}
@media (max-width:520px){.extras{grid-template-columns:repeat(2,1fr)}}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--green);color:var(--cream);border-radius:10px;padding:8px 11px;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.25);max-width:240px;transform:translate(-50%,calc(-100% - 12px))}
.tip b{color:var(--gold)}
.loading{padding:60px 0;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="emblem" viewBox="0 0 168 168"><circle cx="84" cy="84" r="80" fill="none" stroke="#E3B04B" stroke-width="6"/><g transform="translate(32 24)"><line x1="34" y1="10" x2="34" y2="104" stroke="#F3EAD3" stroke-width="5" stroke-linecap="round"/><path d="M36 12 L92 28 L36 46 Z" fill="#E3B04B"/><path d="M8 104 C 14 92, 40 90, 60 94 C 76 97, 94 94, 98 102 C 102 112, 80 116, 54 116 C 28 116, 4 114, 8 104 Z" fill="#E2CF9F"/><circle cx="66" cy="98" r="9" fill="#F3EAD3"/></g></symbol>
</svg>

<header class="bar"><div class="wrap">
 <a class="brand" href="index.html"><svg><use href="#emblem"/></svg><b>Sandie<i>.</i></b><span>Stats</span></a>
 <nav><a href="https://aleccouric-code.github.io/tiger5/">Open the App</a><button id="signout" hidden>Sign Out</button></nav>
</div></header>

<main id="main"><div class="loading">Loading…</div></main>
<div class="tip" id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
// Same Supabase project as the app. The publishable key is meant to be public;
// row level security means you only ever see your own rounds and your friends'.
const SUPABASE_URL='https://afzzyrfmlhfjqdpntuuv.supabase.co',SUPABASE_KEY='sb_publishable_ByQa7tusncWkKMFTVR5SBg_XOWybLSM';
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}):null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rel=n=>n===0?'E':(n>0?'+'+n:''+n);
const fmtIdx=v=>v==null?'—':(v<0?'+'+(-v).toFixed(1):v.toFixed(1));
const fmtDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};
const played=h=>h.score!=null;
const AVC=['#2e6b45','#8a5a1f','#3d5a80','#7a3b52','#5b6b2e','#2f6f73','#6b4c9a','#a0442c'];
const avColor=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return AVC[h%AVC.length]};
const RULES=[['r1','6+ on par 5s'],['r2','Doubles or worse'],['r3','3-putts'],['r4','Bogeys with a scoring club'],['r5','Missed easy up-and-downs']];

// Handicap index: same World Handicap System table the app uses.
const TABLE={3:[1,-2],4:[1,-1],5:[1,0],6:[2,-1],7:[2,0],8:[2,0],9:[3,0],10:[3,0],11:[3,0],12:[4,0],13:[4,0],14:[4,0],15:[5,0],16:[5,0],17:[6,0],18:[6,0],19:[7,0],20:[8,0]};
function hcp(rounds){
 const rs=rounds.filter(r=>typeof r.diff==='number').sort((a,b)=>b.date.localeCompare(a.date)||b.at-a.at).slice(0,20),t=TABLE[rs.length];
 if(!t)return null;const low=[...rs].sort((a,b)=>a.diff-b.diff).slice(0,t[0]);
 return Math.min(54,Math.round((low.reduce((a,r)=>a+r.diff,0)/t[0]+t[1])*10)/10);
}
const fromRow=r=>({id:r.id,uid:r.user_id,course:r.course,tee:r.tee,date:r.date,n:r.n,par:r.par,parPlayed:r.par_played,score:r.score,putts:r.putts,t5:r.t5,per:r.per||{},diff:r.diff==null?null:+r.diff,complete:r.complete,holes:r.holes||[],nine:r.nine,at:Date.parse(r.created_at)||0});

const S={me:null,profile:null,rounds:[],friends:[],period:'all'};

/* ---------- auth ---------- */
async function start(){
 if(!sb){$('#main').innerHTML='<div class="loading">Couldn’t load. Check your connection and refresh.</div>';return}
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return showSignin();
 S.me=session.user.id;await loadData();
}
function showSignin(msg){
 $('#signout').hidden=true;
 $('#main').innerHTML=`<section class="signin"><form class="card" id="sform">
  <h1>Your stats.</h1><p>Sign in with the same email and password you use in the Sandie app.</p>
  <label for="em">Email</label><input id="em" type="email" autocomplete="email" required>
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
  ${msg?`<p class="err" role="alert">${esc(msg)}</p>`:''}
  <button class="btn" type="submit">Sign In</button>
  <small>New to Sandie? <a href="https://aleccouric-code.github.io/tiger5/">Create your account in the app</a>, post a round, then come back.</small>
 </form></section>`;
 $('#sform').addEventListener('submit',async e=>{
  e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='Signing in…';
  const {data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error)return showSignin(/invalid/i.test(error.message)?'That email or password didn’t match.':error.message);
  S.me=data.user.id;$('#main').innerHTML='<div class="loading">Loading your stats…</div>';loadData();
 });
}
$('#signout').addEventListener('click',async()=>{await sb.auth.signOut();showSignin()});

/* ---------- data ---------- */
async function loadData(){
 $('#signout').hidden=false;
 try{
  const {data:prof}=await sb.from('profiles').select('id,handle,avatar_url,friend_code').eq('id',S.me).maybeSingle();
  S.profile=prof||{handle:'Golfer'};
  const {data:rs,error}=await sb.from('rounds').select('*').eq('user_id',S.me).order('date');if(error)throw error;
  S.rounds=(rs||[]).map(fromRow);
  // Friends (for the comparison): accepted friendships, their names and rounds.
  const {data:fr}=await sb.from('friendships').select('*').eq('status','accepted');
  const ids=(fr||[]).map(f=>f.requester===S.me?f.addressee:f.requester);
  if(ids.length){
   const [{data:ps},{data:frs}]=await Promise.all([sb.from('profiles').select('id,handle,avatar_url').in('id',ids),sb.from('rounds').select('*').in('user_id',ids)]);
   S.friends=(ps||[]).map(p=>({...p,rounds:(frs||[]).filter(r=>r.user_id===p.id).map(fromRow)}));
  }
  render();
 }catch(e){console.error(e);$('#main').innerHTML=`<div class="loading">Your stats didn’t load. ${esc(e.message||'')} <br><br><button class="btn" onclick="location.reload()">Try Again</button></div>`}
}

/* ---------- derived stats ---------- */
function inPeriod(r){
 if(S.period==='all')return true;
 const d=new Date();if(S.period==='year')return r.date>=d.getFullYear()+'-01-01';
 d.setDate(d.getDate()-30);return r.date>=d.toISOString().slice(0,10);
}
function stats(rs){
 const fin=rs.filter(r=>r.complete),f18=fin.filter(r=>r.n===18),holes=fin.reduce((a,r)=>a+r.n,0);
 const per18=(f)=>holes?fin.reduce((a,r)=>a+f(r),0)/holes*18:null;
 const allHoles=rs.flatMap(r=>(r.holes||[]).filter(played));
 const dist={eagle:0,birdie:0,par:0,bogey:0,double:0,triple:0};
 allHoles.forEach(h=>{const d=h.score-h.par;if(d<=-2)dist.eagle++;else if(d===-1)dist.birdie++;else if(d===0)dist.par++;else if(d===1)dist.bogey++;else if(d===2)dist.double++;else dist.triple++});
 const byPar={};[3,4,5].forEach(p=>{const hs=allHoles.filter(h=>h.par===p);byPar[p]=hs.length?{n:hs.length,avg:hs.reduce((a,h)=>a+h.score,0)/hs.length}:null});
 const nineSplit=f18.length?{front:f18.reduce((a,r)=>a+r.holes.slice(0,9).reduce((x,h)=>x+(h.score-h.par),0),0)/f18.length,back:f18.reduce((a,r)=>a+r.holes.slice(9).reduce((x,h)=>x+(h.score-h.par),0),0)/f18.length}:null;
 const puttRounds=fin.filter(r=>r.putts!=null),puttHoles=puttRounds.flatMap(r=>r.holes.filter(played));
 const sum=k=>rs.reduce((a,r)=>a+(r.holes||[]).reduce((x,h)=>x+(+h[k]||0),0),0);
 return{
  rounds:rs.length,fin,f18,
  avg:f18.length?f18.reduce((a,r)=>a+r.score,0)/f18.length:null,
  best:f18.length?f18.reduce((b,r)=>!b||r.score<b.score?r:b,null):null,
  t5:per18(r=>r.t5),
  putts:puttRounds.length?puttRounds.reduce((a,r)=>a+r.putts,0)/puttRounds.reduce((a,r)=>a+r.n,0)*18:null,
  threePutt:puttHoles.length?puttHoles.filter(h=>h.putts>=3).length/puttHoles.length:null,
  onePutt:puttHoles.length?puttHoles.filter(h=>h.putts<=1).length/puttHoles.length:null,
  dist,byPar,nineSplit,holesPlayed:allHoles.length,
  rules:RULES.map(([k,l])=>[l,holes?fin.reduce((a,r)=>a+((r.per||{})[k]||0),0)/holes*18:0]),
  extras:{beer:sum('beer'),gb:sum('gb'),club:sum('club'),mush:sum('mush')}
 };
}
// Index after each rated round, oldest first (uses every round, not just the period).
function indexHistory(rounds){
 const sorted=[...rounds].sort((a,b)=>a.date.localeCompare(b.date)||a.at-b.at),out=[];
 sorted.forEach((r,i)=>{if(typeof r.diff!=='number')return;const ix=hcp(sorted.slice(0,i+1));out.push({date:r.date,diff:r.diff,index:ix,course:r.course,score:r.score})});
 return out;
}

/* ---------- charts (plain SVG, one hue, hover tooltips) ---------- */
const tip=$('#tip');
function showTip(e,html){tip.innerHTML=html;tip.hidden=false;tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px'}
function hideTip(){tip.hidden=true}
// Line chart: points [{x:label, y, tip}], optional dots series sharing the same y scale.
function lineChart(el,pts,opt){
 const W=640,H=240,L=38,R=12,T=14,B=26;
 if(pts.length<2&&!(opt.dots||[]).length){el.innerHTML='<p class="empty">Post a few more rounds to see this trend.</p>';return}
 const all=[...pts.map(p=>p.y),...(opt.dots||[]).map(p=>p.y)].filter(v=>v!=null);
 let lo=Math.min(...all),hi=Math.max(...all);if(opt.zero)lo=Math.min(0,lo);const pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;
 const n=Math.max(pts.length,(opt.dots||[]).length),x=i=>L+(n<=1?0:i*(W-L-R)/(n-1)),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
 const ticks=4,step=(hi-lo)/ticks;let g='';
 for(let i=0;i<=ticks;i++){const v=lo+step*i,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#EEE7D6"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${opt.fmt?opt.fmt(v):Math.round(v)}</text>`}
 if(opt.ref!=null&&opt.ref>lo&&opt.ref<hi)g+=`<line x1="${L}" x2="${W-R}" y1="${y(opt.ref)}" y2="${y(opt.ref)}" stroke="#9A6B12" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-R}" y="${y(opt.ref)-6}" text-anchor="end" fill="#9A6B12">${esc(opt.refLabel||'')}</text>`;
 const lab=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i);
 const xsrc=pts.length>=(opt.dots||[]).length?pts:opt.dots;
 lab.forEach(i=>{if(xsrc[i])g+=`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${esc(xsrc[i].x)}</text>`});
 (opt.dots||[]).forEach((p,i)=>{g+=`<circle cx="${x(i)}" cy="${y(p.y)}" r="4.5" fill="#9CC3A8" stroke="#fff" stroke-width="2"/>`});
 const line=pts.filter(p=>p.y!=null).map((p,i)=>`${i?'L':'M'}${x(pts.indexOf(p)).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
 if(line)g+=`<path d="${line}" fill="none" stroke="#2E6B45" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
 const lastI=pts.length-1;if(pts[lastI]&&pts[lastI].y!=null)g+=`<circle cx="${x(lastI)}" cy="${y(pts[lastI].y)}" r="5" fill="#2E6B45" stroke="#fff" stroke-width="2"/><text class="lab" x="${x(lastI)-8}" y="${y(pts[lastI].y)-10}" text-anchor="end">${(opt.endFmt||opt.fmt||String)(pts[lastI].y)}</text>`;
 g+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#14231A" stroke-opacity=".25" visibility="hidden"/><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" class="hit"/>`;
 el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria)}">${g}</svg>`;
 const svg=el.querySelector('svg'),xh=svg.querySelector('.xh'),hit=svg.querySelector('.hit');
 hit.addEventListener('pointermove',e=>{const b=svg.getBoundingClientRect(),px=(e.clientX-b.left)/b.width*W,i=Math.max(0,Math.min(n-1,Math.round((px-L)/((W-L-R)/Math.max(1,n-1)))));
  xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('visibility','visible');showTip(e,(opt.tip||(()=>''))(i))});
 hit.addEventListener('pointerleave',()=>{xh.setAttribute('visibility','hidden');hideTip()});
}
// Vertical bars: [{label, value, tip}]
function barChart(el,items,opt){
 const W=640,H=230,L=34,R=8,T=18,B=30,max=Math.max(1,...items.map(i=>i.value)),bw=(W-L-R)/items.length;
 let g='';for(let i=0;i<=4;i++){const v=max*i/4,yy=T+(H-T-B)*(1-v/max);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#EEE7D6"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${opt.fmt?opt.fmt(v):Math.round(v)}</text>`}
 items.forEach((it,i)=>{const h=(H-T-B)*it.value/max,x0=L+i*bw+bw*.18,w=bw*.64,y0=H-B-h;
  g+=`<path d="M${x0},${H-B} V${y0+Math.min(4,h)} Q${x0},${y0} ${x0+Math.min(4,w/2)},${y0} H${x0+w-Math.min(4,w/2)} Q${x0+w},${y0} ${x0+w},${y0+Math.min(4,h)} V${H-B} Z" fill="${it.color||'#2E6B45'}"/>
  <text x="${x0+w/2}" y="${H-10}" text-anchor="middle">${esc(it.label)}</text>${it.value?`<text class="lab" x="${x0+w/2}" y="${y0-6}" text-anchor="middle">${opt.fmt?opt.fmt(it.value):it.value}</text>`:''}
  <rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-i="${i}" class="hit"/>`});
 el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria)}">${g}</svg>`;
 el.querySelectorAll('.hit').forEach(r=>{r.addEventListener('pointermove',e=>showTip(e,items[+r.dataset.i].tip));r.addEventListener('pointerleave',hideTip)});
}
// Horizontal bars as HTML: [{label, value, display, me}]
function hbars(items,max){
 max=max||Math.max(1e-9,...items.map(i=>i.value));
 return `<div class="hbar">${items.map(i=>`<div class="row${i.me?' me':''}"><span class="t">${esc(i.label)}</span><span class="track"><span class="fill" style="width:${Math.max(2,i.value/max*100)}%"></span></span><span class="val">${esc(i.display)}</span></div>`).join('')}</div>`;
}

/* ---------- page ---------- */
function render(){
 const all=S.rounds,rs=all.filter(inPeriod),st=stats(rs),ix=hcp(all);
 const hist=indexHistory(all);
 const monthAgo=hist.filter(h=>h.date<=new Date(Date.now()-30*864e5).toISOString().slice(0,10)).pop();
 const ixDelta=ix!=null&&monthAgo&&monthAgo.index!=null?Math.round((ix-monthAgo.index)*10)/10:null;
 const p=S.profile,avatar=p.avatar_url&&/^https:\/\/afzzyrfmlhfjqdpntuuv\.supabase\.co\//.test(p.avatar_url)?`<img class="av" src="${esc(p.avatar_url)}" alt="">`:`<span class="av" style="background:${avColor(S.me)}">${esc((p.handle||'?').slice(0,1).toUpperCase())}</span>`;
 const rating=st.t5==null?null:st.t5<3?'👑 God Tier':st.t5<=5?'🐐 Goated':'😐 Average';
 let h=`<div class="dash"><div class="wrap">
  <div class="who">${avatar}<div><h1>${esc(p.handle||'Golfer')}</h1><p>${all.length} rounds posted${rating?` · Rating: ${rating}`:''}</p></div></div>
  <div class="filters"><div class="seg" role="group" aria-label="Time period">${[['all','All Time'],['year','This Year'],['30','Last 30 Days']].map(([k,l])=>`<button data-per="${k}" aria-pressed="${S.period===k}">${l}</button>`).join('')}</div><span class="count">${rs.length} round${rs.length===1?'':'s'} in this period</span></div>`;
 if(!all.length){$('#main').innerHTML=h+`<div class="panel w12"><p class="empty">No rounds yet. Post a round in the app and your stats show up here.</p></div></div></div>`;return}
 h+=`<div class="kpis">
  <div class="kpi hero"><div class="l">Handicap Index</div><div class="v">${fmtIdx(ix)}</div><div class="s">${ixDelta==null?'Current index':ixDelta===0?'Same as 30 days ago':`${ixDelta<0?'▼':'▲'} ${Math.abs(ixDelta).toFixed(1)} vs 30 days ago`}</div></div>
  <div class="kpi"><div class="l">Avg Score (18)</div><div class="v">${st.avg==null?'—':st.avg.toFixed(1)}</div><div class="s">${st.f18.length} finished 18-hole rounds</div></div>
  <div class="kpi"><div class="l">Best Round</div><div class="v">${st.best?st.best.score:'—'}</div><div class="s">${st.best?esc(st.best.course)+' · '+fmtDate(st.best.date):'Finish an 18 to set one'}</div></div>
  <div class="kpi"><div class="l">Tiger 5 per 18</div><div class="v">${st.t5==null?'—':st.t5.toFixed(1)}</div><div class="s">${rating||'Misses per 18 holes'}</div></div>
 </div>
 <div class="grid">
  <div class="panel w8"><h2>Handicap Index Over Time</h2><p class="sub">Your index after each rated round (line), with that round’s differential (dots). All time.</p><div id="c-index"></div>
   <div class="legend"><span><i style="background:#2E6B45"></i>Handicap index</span><span><i class="dot" style="background:#9CC3A8"></i>Round differential</span></div>
   <details class="tbl"><summary>View as table</summary><div class="scroll"><table><thead><tr><th>Date</th><th>Course</th><th class="n">Score</th><th class="n">Diff</th><th class="n">Index</th></tr></thead><tbody>${[...hist].reverse().map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.course)}</td><td class="n">${x.score}</td><td class="n">${x.diff.toFixed(1)}</td><td class="n">${fmtIdx(x.index)}</td></tr>`).join('')}</tbody></table></div></details></div>
  <div class="panel w4"><h2>Putting</h2><p class="sub">Rounds with putts on every hole.</p>
   <div class="extras" style="grid-template-columns:1fr 1fr">
    <div><b>${st.putts==null?'—':st.putts.toFixed(1)}</b><span>Putts per 18</span></div>
    <div><b>${st.threePutt==null?'—':Math.round(st.threePutt*100)+'%'}</b><span>3-putt holes</span></div>
    <div><b>${st.onePutt==null?'—':Math.round(st.onePutt*100)+'%'}</b><span>1-putts or better</span></div>
    <div><b>${st.holesPlayed}</b><span>Holes played</span></div>
   </div></div>
  <div class="panel"><h2>Score to Par</h2><p class="sub">Each finished 18-hole round in this period, oldest to newest.</p><div id="c-score"></div></div>
  <div class="panel"><h2>Hole-by-Hole Results</h2><p class="sub">How every hole you played this period turned out.</p><div id="c-dist"></div>
   <details class="tbl"><summary>View as table</summary><table><tbody>${Object.entries({'Eagle or better':st.dist.eagle,Birdie:st.dist.birdie,Par:st.dist.par,Bogey:st.dist.bogey,'Double bogey':st.dist.double,'Triple or worse':st.dist.triple}).map(([k,v])=>`<tr><td>${k}</td><td class="n">${v}</td><td class="n">${st.holesPlayed?Math.round(v/st.holesPlayed*100):0}%</td></tr>`).join('')}</tbody></table></details></div>
  <div class="panel w4"><h2>Scoring by Par</h2><p class="sub">Average strokes over par on each hole type.</p>${hbars([3,4,5].filter(k=>st.byPar[k]).map(k=>({label:'Par '+k+'s',value:Math.max(0,st.byPar[k].avg-k),display:'+'+(st.byPar[k].avg-k).toFixed(2)})),null)||'<p class="empty">No holes yet.</p>'}
   <p class="sub" style="margin-top:10px">${[3,4,5].filter(k=>st.byPar[k]).map(k=>`Par ${k}: ${st.byPar[k].avg.toFixed(2)} avg over ${st.byPar[k].n} holes`).join(' · ')}</p></div>
  <div class="panel w4"><h2>Front vs Back</h2><p class="sub">Average to par on each nine, finished 18s.</p>${st.nineSplit?hbars([{label:'Front 9',value:Math.max(0,st.nineSplit.front),display:rel(Math.round(st.nineSplit.front*10)/10)},{label:'Back 9',value:Math.max(0,st.nineSplit.back),display:rel(Math.round(st.nineSplit.back*10)/10)}]):'<p class="empty">Finish an 18 to compare.</p>'}
   ${st.nineSplit?`<p class="sub" style="margin-top:10px">You’re ${Math.abs(st.nineSplit.front-st.nineSplit.back)<.3?'about even on both nines':`stronger on the ${st.nineSplit.front<st.nineSplit.back?'front':'back'} by ${Math.abs(st.nineSplit.front-st.nineSplit.back).toFixed(1)} strokes`}.</p>`:''}</div>
  <div class="panel w4"><h2>Where the Strokes Go</h2><p class="sub">Tiger 5 misses per 18 holes, by rule.</p>${hbars(st.rules.map(([l,v])=>({label:l,value:v,display:v.toFixed(1)})).sort((a,b)=>b.value-a.value))}</div>
  <div class="panel"><h2>Courses</h2><p class="sub">Rounds in this period, by course.</p>${courseTable(rs)}</div>
  <div class="panel"><h2>You vs Friends</h2><p class="sub">Handicap index, lowest first. You’re highlighted.</p>${friendsCompare(ix)}</div>
  <div class="panel w12"><h2>Off the Course</h2><p class="sub">Logged hole by hole this period.</p>
   <div class="extras"><div><b>🍺 ${st.extras.beer}</b><span>Beers${rs.length?' · '+(st.extras.beer/rs.length).toFixed(1)+'/round':''}</span></div><div><b>💨 ${st.extras.gb}</b><span>Rips${rs.length?' · '+(st.extras.gb/rs.length).toFixed(1)+'/round':''}</span></div><div><b>🪃 ${st.extras.club}</b><span>Thrown clubs</span></div><div><b>🍄 ${st.extras.mush}</b><span>Mushrooms</span></div></div></div>
  <div class="panel w12"><h2>Recent Rounds</h2><p class="sub">This period, newest first.</p><div class="scroll"><table><thead><tr><th>Date</th><th>Course</th><th class="n">Score</th><th class="n">To Par</th><th class="n">Putts</th><th class="n">Tiger 5</th><th class="n">Diff</th></tr></thead><tbody>${[...rs].reverse().slice(0,25).map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${esc(r.course)}${r.n===9?' (9)':''}</td><td class="n"><b>${r.score}</b></td><td class="n">${r.complete?rel(r.score-r.parPlayed):'—'}</td><td class="n">${r.putts==null?'—':r.putts}</td><td class="n">${r.t5}</td><td class="n">${r.diff==null?'—':r.diff.toFixed(1)}</td></tr>`).join('')}</tbody></table></div></div>
 </div></div></div>`;
 $('#main').innerHTML=h;
 $('#main').querySelectorAll('[data-per]').forEach(b=>b.addEventListener('click',()=>{S.period=b.dataset.per;render()}));
 const short=d=>{const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString(undefined,{month:'short',day:'numeric'})};
 lineChart($('#c-index'),hist.map(x=>({x:short(x.date),y:x.index})),{dots:hist.map(x=>({x:short(x.date),y:x.diff})),fmt:v=>v.toFixed(0),endFmt:fmtIdx,aria:'Handicap index over time',
  tip:i=>{const x=hist[i];return x?`<b>${fmtDate(x.date)}</b><br>${esc(x.course)} · ${x.score}<br>Differential ${x.diff.toFixed(1)} · Index ${fmtIdx(x.index)}`:''}});
 const f18=st.f18;
 lineChart($('#c-score'),f18.map(r=>({x:short(r.date),y:r.score-r.parPlayed})),{fmt:v=>rel(Math.round(v)),ref:f18.length?f18.reduce((a,r)=>a+r.score-r.parPlayed,0)/f18.length:null,refLabel:'your average',aria:'Score to par per round',
  tip:i=>{const r=f18[i];return r?`<b>${rel(r.score-r.parPlayed)}</b> (${r.score})<br>${esc(r.course)}<br>${fmtDate(r.date)}`:''}});
 const dlab=[['Eagle+',st.dist.eagle],['Birdie',st.dist.birdie],['Par',st.dist.par],['Bogey',st.dist.bogey],['Double',st.dist.double],['Triple+',st.dist.triple]];
 barChart($('#c-dist'),dlab.map(([l,v])=>({label:l,value:v,tip:`<b>${l}</b>: ${v} hole${v===1?'':'s'}${st.holesPlayed?` (${Math.round(v/st.holesPlayed*100)}%)`:''}`})),{aria:'How each hole turned out'});
}
function courseTable(rs){
 const by={};rs.forEach(r=>{(by[r.course]=by[r.course]||[]).push(r)});
 const rows=Object.entries(by).map(([c,list])=>{const f=list.filter(r=>r.complete&&r.n===18);return{c,n:list.length,avg:f.length?f.reduce((a,r)=>a+r.score,0)/f.length:null,best:f.length?Math.min(...f.map(r=>r.score)):null}}).sort((a,b)=>b.n-a.n);
 if(!rows.length)return '<p class="empty">No rounds in this period.</p>';
 return `<div class="scroll"><table><thead><tr><th>Course</th><th class="n">Rounds</th><th class="n">Avg</th><th class="n">Best</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.c)}</td><td class="n">${r.n}</td><td class="n">${r.avg==null?'—':r.avg.toFixed(1)}</td><td class="n">${r.best==null?'—':r.best}</td></tr>`).join('')}</tbody></table></div>`;
}
function friendsCompare(myIx){
 const list=[{label:'You',ix:myIx,me:true},...S.friends.map(f=>({label:f.handle||'Golfer',ix:hcp(f.rounds)}))].filter(x=>x.ix!=null).sort((a,b)=>a.ix-b.ix);
 if(list.length<2)return '<p class="empty">Add friends in the app to compare. Each player needs 3 rated rounds for an index.</p>';
 const max=Math.max(...list.map(x=>x.ix),1);
 return hbars(list.map(x=>({label:x.label,value:Math.max(0.1,x.ix),display:fmtIdx(x.ix),me:x.me})),max);
}
start();
</script>
</body>
